<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎶 Movie Song Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #fff3e0;
    }

    h2 {
      color: #333;
    }

    button {
      padding: 10px 20px;
      background-color: #ff6f61;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e85d4f;
    }

    .song-container {
      margin-top: 30px;
    }

    .song-container img {
      width: 300px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .song-title {
      margin: 10px 0;
      font-weight: bold;
      font-size: 18px;
    }

    .song-link {
      text-decoration: none;
      color: #0077b6;
      font-weight: bold;
    }

    .song-link:hover {
      color: #023e8a;
    }
  </style>
</head>
<body>
  <h2>🎵 Random Bollywood Song Viewer</h2>
  <button onclick="getRandomSong()">Get Random Song</button>
  <div class="song-container" id="songContainer"></div>

  <script>
    async function getRandomSong() {
      const container = document.getElementById('songContainer');
      container.innerHTML = `<p>Loading...</p>`;

      try {
        const response = await fetch('https://saavn.dev/api/search/songs?query=bollywood');
        const data = await response.json();

        const songs = data.data?.results || [];

        if (songs.length === 0) {
          throw new Error("No songs found");
        }

        const randomSong = songs[Math.floor(Math.random() * songs.length)];

        const title = randomSong.name || "Unknown Title";
        const songUrl = randomSong.url || "#";
        const imageUrl = randomSong.image?.[2]?.link || randomSong.image?.[0]?.link || "https://via.placeholder.com/300?text=No+Image";

        container.innerHTML = `
          <img src="${imageUrl}" alt="Song Poster" />
          <div class="song-title">${title}</div>
          <a class="song-link" href="${songUrl}" target="_blank">▶️ Play on JioSaavn</a>
        `;
      } catch (error) {
        console.error(error);
        container.innerHTML = `<p style="color: red;">Could not load song. Try again later.</p>`;
      }
    }
  </script>
</body>
</html>
